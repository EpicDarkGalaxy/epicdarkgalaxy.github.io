<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Downloads</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #181a1b;
            color: #f1f1f1;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 40px auto;
            background: #23272a;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            padding: 32px 24px;
        }
        h1 {
            text-align: center;
            color: #ffb300;
        }
        ul.apk-list {
            list-style: none;
            padding: 0;
        }
        ul.apk-list li {
            background: #2c2f33;
            margin: 16px 0;
            padding: 18px 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .apk-info {
            display: flex;
            flex-direction: column;
        }
        .apk-title {
            font-size: 1.2em;
            font-weight: bold;
        }
        .apk-desc {
            font-size: 0.97em;
            color: #bdbdbd;
        }
        .download-btn {
            background: #ffb300;
            color: #23272a;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background: #ffa000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>APK Downloads</h1>
        <ul class="apk-list">
            <li>
                <div class="apk-info">
                    <span class="apk-title">Example App 1</span>
                    <span class="apk-desc">A sample description for APK 1.</span>
                </div>
                <a class="download-btn" href="#" download>Download</a>
            </li>
            <li>
                <div class="apk-info">
                    <span class="apk-title">Example App 2</span>
                    <span class="apk-desc">A sample description for APK 2.</span>
                </div>
                <a class="download-btn" href="#" download>Download</a>
            </li>
            <!-- Add more APK entries here -->
        </ul>
    </div>
</body>
</html>
